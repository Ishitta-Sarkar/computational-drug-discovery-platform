[project]
name = "ligand-druglikeness"
version = "0.2.0"
description = "Ligand drug-likeness screening (Lipinski, Veber, QED) for a small natural-product set."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ishitta Sarkar" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
